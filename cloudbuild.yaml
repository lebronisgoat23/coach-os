substitutions:
  _REGION: asia-east1
  _SERVICE_NAME: coach-os
  _AR_REPOSITORY: coach-os
  _IMAGE_NAME: coach-os

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: ensure-artifact-registry-repo
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts repositories describe "${_AR_REPOSITORY}" \
          --location="${_REGION}" \
          --project="${PROJECT_ID}" >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_AR_REPOSITORY}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="Coach OS container images" \
          --project="${PROJECT_ID}"

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=2
      - --set-env-vars=NEXT_PUBLIC_COMMIT_SHA=${SHORT_SHA}
      - --set-secrets=ANALYTICS_EVENT_SALT=vitrion-analytics-salt:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}
